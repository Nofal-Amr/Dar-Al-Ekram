<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#F5F6F3">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#121813">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="دار الإكرام">
<title>دار الإكرام — إدارة الحالات والصرف</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<!-- Everything is served from this site (no CDNs) so the app still opens when the internet drops. -->
<link rel="stylesheet" href="vendor/fonts/fonts.css">
<link rel="preload" href="vendor/fonts/BalooBhaijaan2-arabic.woff2" as="font" type="font/woff2" crossorigin>
<script src="vendor/supabase.js"></script>
<style>
:root{
  --paper:#F5F6F3; --card:#FFFFFF; --ink:#1E2A22; --muted:#627067; --line:#DDE3DC;
  --green:#235E2D; --green-soft:#E3EEE5; --brand:#962A25; --brand-soft:#F6E2E1; --plum:#532352; --plum-soft:#EFE4F0; --on:#FFFFFF; --gold:#B87D14; --gold-ink:#855A0E; --gold-soft:#F7ECD6;
  --red:#962A25; --red-soft:#F6E1DF; --blue:#2D5B86; --blue-soft:#E2EBF4;
  --font:"Baloo Bhaijaan 2","Segoe UI",Tahoma,sans-serif; --display:"Baloo Bhaijaan 2","Segoe UI",Tahoma,sans-serif;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#121813; --card:#1A231C; --ink:#E7EEE8; --muted:#9AAB9F; --line:#2C3A2F;
  --green:#68B97A; --green-soft:#1C3322; --brand:#E3837A; --brand-soft:#3A1F1D; --plum:#C995CD; --plum-soft:#34233A; --on:#10180F; --gold:#E0AE52; --gold-ink:#E0AE52; --gold-soft:#3A2F17; --red:#E07A70; --red-soft:#3A1F1C; --blue:#86B2DB; --blue-soft:#1A2B3B;}}
:root[data-theme="dark"]{--paper:#121813; --card:#1A231C; --ink:#E7EEE8; --muted:#9AAB9F; --line:#2C3A2F;
  --green:#68B97A; --green-soft:#1C3322; --brand:#E3837A; --brand-soft:#3A1F1D; --plum:#C995CD; --plum-soft:#34233A; --on:#10180F; --gold:#E0AE52; --gold-ink:#E0AE52; --gold-soft:#3A2F17; --red:#E07A70; --red-soft:#3A1F1C; --blue:#86B2DB; --blue-soft:#1A2B3B;}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%;color-scheme:light dark}
:root[data-theme="light"]{color-scheme:light}:root[data-theme="dark"]{color-scheme:dark}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.6}
body.big{font-size:17px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
/* controls respond on press, never select their label, and skip the double-tap-zoom wait */
button,a,.tile,.kpi,.rolec,label.f{touch-action:manipulation}
button,.chip,nav.tabs{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.btn,.tile,.kpi,.s-tile,.s-card,.s-give,.s-call,.s-back,.give .gb{transition:transform .1s ease-out,background-color .1s,border-color .1s}
.btn:not(:disabled):active,.tile:active,.kpi:active,.s-card:active,.s-give:not(:disabled):active,.s-call:active,.s-back:active,.give .gb:active{transform:scale(.97)}
::selection{background:var(--green-soft);color:var(--ink)}
input,select,textarea{caret-color:var(--green);accent-color:var(--green)}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.wrap{max-width:980px;margin:0 auto;padding:0 16px 110px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 0 14px;margin-bottom:20px;position:relative}
header.top::after{content:"";position:absolute;inset-inline:0;bottom:0;height:4px;border-radius:2px;background:linear-gradient(90deg,var(--brand) 0 50%,var(--green) 50% 82%,var(--plum) 82% 100%)}
.brand{display:flex;align-items:center;gap:12px}
.brand .mark{width:64px;height:64px;border-radius:14px;background:#fff;display:grid;place-items:center;padding:5px;box-shadow:0 0 0 1px var(--line)}
.brand .mark img{width:100%;height:100%;object-fit:contain}
header.top h1{font-family:var(--display);font-size:30px;line-height:1.1;margin:0;color:var(--brand)}
header.top p{margin:4px 0 0;color:var(--muted);font-size:13px}
.who{font-size:12px;color:var(--muted);text-align:end}
.who b{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--muted);margin-inline-end:5px;vertical-align:middle}
.who.on b{background:#2E9E6B}.who.off b{background:var(--red)}
nav.tabs{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;z-index:20;padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs button{flex:1;max-width:180px;border:0;background:none;padding:9px 2px 11px;font-size:12.5px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;border-top:3px solid transparent}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button.act{color:var(--green);border-top-color:var(--green);font-weight:600}
nav.tabs button[hidden]{display:none}
h2{font-size:20px;margin:0 0 12px;font-weight:600}
h3{font-size:16px;margin:20px 0 8px;font-weight:600}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:0}
input[type=text],input[type=search],input[type=number],input[type=month],input[type=date],input[type=password],input[type=tel],input[type=email],select,textarea{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:9px 11px;min-height:44px;width:100%;font-size:16px}
input:focus,select:focus,textarea:focus{border-color:var(--green)}
textarea{min-height:70px;resize:vertical}
label.f{display:block;font-size:12.5px;color:var(--muted);margin-bottom:10px}
/* 16px minimum: iOS zooms the page into any smaller input and never zooms back out */
label.f > input,label.f > select,label.f > textarea{margin-top:3px;font-size:16px;color:var(--ink)}
.btn{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:9px 14px;min-height:44px;font-weight:500;white-space:nowrap}
.btn.pri{background:var(--green);border-color:var(--green);color:var(--on)}
.btn.gold{background:var(--plum);border-color:var(--plum);color:var(--on)}
.btn.danger{color:var(--red);border-color:var(--red-soft)}
.btn.sm{padding:5px 10px;min-height:36px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn[aria-busy=true]{opacity:.8;cursor:progress}
.list{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.item{display:flex;gap:12px;align-items:center;padding:11px 14px;border-bottom:1px solid var(--line);width:100%;text-align:start;background:none;border-inline:0;border-top:0}
.item:last-child{border-bottom:0}
@media (hover:hover) and (pointer:fine){button.item:hover{background:var(--green-soft)}}
.code{font-variant-numeric:tabular-nums;font-size:12px;color:var(--muted);min-width:34px}
.nm{font-weight:500}
.sub{font-size:12.5px;color:var(--muted)}
.chip{display:inline-block;font-size:11.5px;padding:1px 8px;border-radius:20px;background:var(--green-soft);color:var(--green);white-space:nowrap}
.chip.gold{background:var(--gold-soft);color:var(--gold-ink)}.chip.plum{background:var(--plum-soft);color:var(--plum)}.chip.red{background:var(--red-soft);color:var(--red)}.chip.blue{background:var(--blue-soft);color:var(--blue)}.chip.grey{background:var(--line);color:var(--ink)}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
.tbl{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:start;vertical-align:top}
th{font-weight:600;font-size:12.5px;color:var(--muted);background:var(--paper);white-space:nowrap}
td.n{font-variant-numeric:tabular-nums;white-space:nowrap}
.why{font-size:12px;color:var(--muted)}
/* home tiles: the one bold element */
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:22px}
@media (min-width:700px){.tiles{grid-template-columns:repeat(3,1fr)}}
.tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 14px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;min-height:132px;justify-content:center}
.tile .ic{font-size:40px;line-height:1}
.tile strong{font-size:18px;font-weight:600}
.tile small{font-size:12.5px;color:var(--muted)}
.tile.pri{background:var(--green);border-color:var(--green);color:var(--on)}.tile.pri small{color:var(--on);opacity:.8}
@media (hover:hover) and (pointer:fine){.tile:hover{border-color:var(--green)}}
.tile:not(.pri) .ic{filter:saturate(.9)}
.tile.brand-t{border-top:4px solid var(--brand)}
.alert{display:flex;gap:10px;align-items:center;background:var(--gold-soft);border-radius:10px;padding:11px 14px;margin-bottom:8px;width:100%;border:0;text-align:start}
.alert.red{background:var(--brand-soft)}
/* sheet */
.scrim{position:fixed;inset:0;background:rgba(10,25,22,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--paper);width:100%;max-width:780px;height:94vh;height:94dvh;border-radius:16px 16px 0 0;display:flex;flex-direction:column;animation:up .22s ease-out}
@media (min-width:820px){.scrim{align-items:center}.sheet{border-radius:14px;height:auto;max-height:90vh}}
@keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.sh-head{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line);background:var(--card);border-radius:inherit}
.sh-head h2{margin:0;font-size:17px;flex:1}
.sh-body{padding:16px;overflow-y:auto;overscroll-behavior:contain;flex:1;padding-bottom:calc(28px + env(safe-area-inset-bottom,0px))}
.x{border:0;background:var(--paper);border-radius:50%;width:40px;height:40px;font-size:22px;line-height:1}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
@media (max-width:520px){.grid2{grid-template-columns:1fr}}
.checks{display:flex;flex-wrap:wrap;gap:6px 14px;margin:4px 0 12px}
.checks label{display:flex;align-items:center;gap:6px;font-size:14px}
.note{background:var(--gold-soft);border-radius:8px;padding:10px 12px;font-size:13.5px;margin-bottom:12px}
.note.red{background:var(--brand-soft)}.note.green{background:var(--green-soft)}
.toast{position:fixed;bottom:calc(84px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:8px;z-index:60;font-size:14px;max-width:90vw}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.pill-steps{display:flex;gap:6px;align-items:center;font-size:12.5px;color:var(--muted);margin:6px 0 14px}
.pill-steps span.on{color:var(--green);font-weight:600}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-bottom:14px}
.facts div{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 11px}
.facts span{display:block;font-size:11.5px;color:var(--muted)}
.facts strong{font-weight:500;font-size:14.5px}
.give{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line);background:var(--card)}
.give .gb{min-width:96px;min-height:48px;border-radius:10px;border:2px solid var(--green);background:var(--card);color:var(--green);font-weight:600;font-size:15px}
.give.done{background:var(--green-soft)}
.give.done .gb{background:var(--green);color:var(--on)}
.log{font-size:12.5px;color:var(--muted);border-inline-start:2px solid var(--line);padding-inline-start:10px;margin:0;list-style:none}
.log li{margin-bottom:6px}
.phones{font-family:var(--font);direction:rtl;min-height:220px;font-size:14px}
#print{display:none}
@media print{
  body{background:#fff;color:#000}
  .wrap,nav.tabs,.scrim,.toast{display:none!important}
  #print{display:block}
}

/* auth */
.auth{max-width:420px;margin:6vh auto 0;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:26px 22px}
.auth .mark{width:110px;height:110px;margin:0 auto 10px;display:block}
.auth h1{font-family:var(--display);color:var(--brand);text-align:center;margin:0 0 4px;font-size:30px}
.auth p.c{text-align:center;color:var(--muted);margin:0 0 18px}
.auth .btn{width:100%;margin-top:6px;min-height:50px;font-size:16px}
.offline{background:var(--brand);color:var(--on);text-align:center;padding:6px;font-size:13px;position:sticky;top:0;z-index:30}
.spin{display:inline-block;width:16px;height:16px;border:2px solid currentColor;border-inline-end-color:transparent;border-radius:50%;animation:sp .7s linear infinite;vertical-align:middle}
@keyframes sp{to{transform:rotate(360deg)}}
.pin{letter-spacing:.4em;font-variant-numeric:tabular-nums;text-align:center;font-size:20px!important}

/* ===== full UI: dashboard ===== */
.dash-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.qa{display:flex;gap:8px;flex-wrap:wrap}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px}
@media (min-width:700px){.kpis{grid-template-columns:repeat(4,1fr)}}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;text-align:start;display:flex;flex-direction:column;gap:2px;border-top:3px solid var(--green)}
@media (hover:hover) and (pointer:fine){button.kpi:hover{border-color:var(--green)}}
.kpi.warn{border-top-color:var(--brand)}
.kpi span{font-size:12.5px;color:var(--muted)}
.kpi strong{font-size:26px;font-weight:600;line-height:1.2;font-variant-numeric:tabular-nums}
.kpi strong em{font-style:normal;font-size:14px;color:var(--muted)}
.kpi small{font-size:12px;color:var(--muted)}
.dash-grid{display:grid;gap:4px 18px}
@media (min-width:900px){.dash-grid{grid-template-columns:3fr 2fr}}
.prog{display:block;height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin:6px 0 3px}
.prog i{display:block;height:100%;background:var(--green);border-radius:inherit}
.prog.big{height:10px;border-radius:5px}
.dt tbody tr{cursor:pointer}
@media (hover:hover) and (pointer:fine){.dt tbody tr:hover{background:var(--green-soft)}}
.dt td{white-space:nowrap}
.roles{display:grid;gap:8px;margin-bottom:14px}
.rolec{display:flex;gap:10px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer}
.rolec:has(input:checked){border-color:var(--green);background:var(--green-soft)}
.rolec input{margin-top:5px;width:18px;height:18px}
.rolec small{display:block;color:var(--muted);font-size:12.5px}
/* wide screens: sidebar nav */
@media (min-width:900px){
  body.wide:not(.simple) nav.tabs{top:0;bottom:0;inset-inline-start:0;inset-inline-end:auto;right:0;left:auto;width:200px;flex-direction:column;justify-content:flex-start;border-top:0;border-inline-end:1px solid var(--line);padding-top:24px}
  body.wide:not(.simple) nav.tabs button{flex:0 0 auto;max-width:none;flex-direction:row;gap:10px;padding:12px 18px;border-top:0;border-inline-start:3px solid transparent;font-size:14.5px;justify-content:flex-start}
  body.wide:not(.simple) nav.tabs button.act{border-inline-start-color:var(--green);background:var(--green-soft)}
  body.wide:not(.simple) .wrap{max-width:1200px;margin-inline-start:200px;margin-inline-end:auto;padding:0 28px 40px}
}
/* ===== simple UI (helpers) ===== */
body.simple{font-size:19px}
body.simple nav.tabs{display:none}
body.simple .wrap{padding-bottom:40px;max-width:640px}
.s-hello{font-size:24px;font-weight:600;margin:4px 0 16px}
.s-tiles{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.s-tile{min-height:170px;border-radius:22px;border:0;color:#fff;font-size:23px;font-weight:600;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;box-shadow:0 2px 0 rgba(0,0,0,.12)}
.s-tile .ic{font-size:58px;line-height:1}
.s-tile.g{background:#235E2D}.s-tile.b{background:#2D5B86}.s-tile.r{background:#962A25}.s-tile.p{background:#532352}
.s-tile:active{transform:scale(.98)}
.s-foot{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:28px}
.s-back{display:block;width:100%;min-height:58px;border-radius:14px;border:2px solid var(--line);background:var(--card);font-size:20px;font-weight:600;margin-bottom:14px;text-align:start;padding:0 18px}
.s-title{font-size:22px;margin:4px 0 12px}
.s-title small{font-size:16px;color:var(--muted);font-weight:400}
.s-list{display:flex;flex-direction:column;gap:10px}
.s-card{display:flex;gap:14px;align-items:center;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:16px;text-align:start;width:100%}
.s-card b,.s-row b{display:block;font-size:20px;font-weight:600}
.s-card small,.s-row small{display:block;font-size:15px;color:var(--muted)}
.s-ic{font-size:40px;line-height:1}
.s-ic.big{font-size:64px}
.s-row{display:flex;gap:12px;align-items:center;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:14px 16px}
.s-row.done{background:var(--green-soft);border-color:transparent}
.s-give{min-width:110px;min-height:64px;border-radius:14px;border:0;background:#235E2D;color:#fff;font-size:21px;font-weight:600}
.s-give:disabled{opacity:.6}
.s-ok{color:var(--green);font-weight:600;font-size:18px;white-space:nowrap}
.s-ok.muted{color:var(--muted)}
.s-call{min-width:110px;min-height:64px;border-radius:14px;background:#962A25;color:#fff;font-size:20px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;padding:0 14px}
.s-call.wide{width:100%;margin-top:10px}
.s-search{font-size:20px!important;min-height:60px!important;border-radius:14px!important;border-width:2px!important;margin-bottom:12px}
.s-count{font-size:18px;margin-bottom:12px}
.s-empty{text-align:center;font-size:22px;color:var(--muted);padding:40px 10px;line-height:1.8}
.s-person{text-align:center;background:var(--card);border:2px solid var(--line);border-radius:18px;padding:20px 16px;margin-bottom:10px}
.s-person h2{font-size:24px;margin:6px 0}
.s-warn{background:var(--brand-soft);border-radius:10px;padding:8px}

/* ===== icons (inline SVG from icons.js) ===== */
svg.i{width:1.15em;height:1.15em;flex:none;vertical-align:-.2em}
.btn,.s-call,a.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px}
.tile .ic svg.i{width:38px;height:38px;stroke-width:1.7}
.s-tile .ic svg.i{width:54px;height:54px;stroke-width:1.6}
.s-ic svg.i{width:34px;height:34px;color:var(--muted)}.s-ic.big svg.i{width:60px;height:60px}
.s-empty svg.i{width:48px;height:48px;display:block;margin:0 auto 8px;color:var(--muted)}
.alert svg.i{width:20px;height:20px}
.s-title svg.i,.s-hello svg.i{color:var(--green)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ===== in-app confirm dialog ===== */
.ask-scrim{position:fixed;inset:0;background:rgba(10,25,22,.5);z-index:70;display:grid;place-items:center;padding:16px;animation:fade .15s ease-out}
.ask{background:var(--card);border-radius:14px;padding:20px 20px 14px;width:100%;max-width:420px;box-shadow:0 12px 40px rgba(0,0,0,.25);animation:pop .18s ease-out}
.ask h2{font-size:18px;margin:0 0 8px}.ask p{margin:0 0 6px;color:var(--ink)}
.ask .bar{margin:14px 0 0}.ask .bar .btn{flex:1}
.btn.danger-solid{background:var(--red);border-color:var(--red);color:var(--on)}
@keyframes fade{from{opacity:0}}@keyframes pop{from{transform:scale(.96);opacity:0}}
@media (prefers-reduced-motion:reduce){.ask-scrim,.ask{animation:none}}

/* ===== field hints, states, paging ===== */
.hint{display:block;min-height:1.2em;margin-top:3px;font-size:12.5px;color:var(--muted)}
.hint.ok{color:var(--green)}.hint.bad{color:var(--red)}
.hint svg.i{vertical-align:-.2em}
.note{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.state{text-align:center;padding:40px 16px;color:var(--muted)}.state h2{color:var(--ink);margin:10px 0 4px}
.state svg.big{width:56px;height:56px}.state .btn{margin-top:14px}
.more{display:flex;justify-content:center;margin:12px 0}
.pend{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;color:var(--gold-ink);font-weight:500;margin-inline:6px}
.pend svg.i{width:13px;height:13px}
.offline{display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap}
.offline.sync{background:var(--gold-soft);color:var(--gold-ink)}
.offline.demo{background:var(--blue-soft);color:var(--blue)}
.ver{text-align:center;margin-top:28px}

/* ===== v1.3: tasks, calls, planner, photos ===== */
h4{font-size:14px;margin:14px 0 6px;color:var(--muted);font-weight:600}
.sortl{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted);flex:0 0 auto}
.sortl select{width:auto}
.tasks .task{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line);width:100%;background:none;border-inline:0;border-top:0;text-align:start}
.tasks .task:last-child{border-bottom:0}
.task.late .nm{color:var(--red)}
.task .tbody{border:0;background:none;text-align:start;padding:0}
.tick{flex:none;width:26px;height:26px;border-radius:50%;border:2px solid var(--green);background:var(--card)}
@media (hover:hover) and (pointer:fine){.tick:not(:disabled):hover{background:var(--green-soft)}button.task.auto:hover{background:var(--green-soft)}}
.aic{flex:none;width:30px;height:30px;border-radius:8px;display:grid;place-items:center;background:var(--green-soft);color:var(--green)}
.aic.red{background:var(--brand-soft);color:var(--brand)}
.ccell{display:inline-flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.cdial{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-width:44px;min-height:44px;border-radius:10px;background:var(--brand);color:#fff;text-decoration:none;padding:0 10px;font-weight:600}
.ccell.big .cdial{min-height:56px;min-width:96px;font-size:18px;border-radius:14px}
.cres{display:inline-flex;gap:6px;flex-wrap:wrap}
.cr{min-height:44px;border-radius:10px;border:2px solid;background:var(--card);font-weight:600;padding:0 10px}
.ccell.big .cr{min-height:56px;font-size:17px}
.cr.ok{border-color:var(--green);color:var(--green)}.cr.no{border-color:var(--gold);color:var(--gold-ink)}.cr.bad{border-color:var(--red);color:var(--red)}.cr.away{border-color:var(--plum);color:var(--plum)}
.cdial.wa{background:#1F8F4E}.cdial.wa.big{min-height:56px;min-width:96px;font-size:18px;border-radius:14px}
.cdial.alt{background:var(--card);color:var(--brand);border:2px solid var(--brand);font-size:13px}
.cchipb{border:0;background:none;padding:0}
.cchip{display:inline-flex;flex-direction:column;align-items:center;font-size:12px;font-weight:600;padding:2px 8px;border-radius:8px;line-height:1.3}
.cchip small{font-size:10.5px;font-weight:400}
.cchip.ok{background:var(--green-soft);color:var(--green)}.cchip.away{background:var(--plum-soft);color:var(--plum)}.cchip.no{background:var(--gold-soft);color:var(--gold-ink)}.cchip.bad{background:var(--red-soft);color:var(--red)}
.give.c-ok,.item.c-ok,.s-row.c-ok{box-shadow:inset 4px 0 0 var(--green)}
.give.c-no,.item.c-no,.s-row.c-no{box-shadow:inset 4px 0 0 var(--gold);background:var(--gold-soft)}
.give.c-bad,.item.c-bad,.s-row.c-bad{box-shadow:inset 4px 0 0 var(--red);background:var(--red-soft)}
.give.c-away,.item.c-away,.s-row.c-away{box-shadow:inset 4px 0 0 var(--plum);background:var(--plum-soft)}
@media (max-width:560px){.give{flex-wrap:wrap}.give .grow{flex:1 1 calc(100% - 60px)}.give .ccell{margin-inline-start:auto}}
.callbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.seg{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.seg button{border:1px solid var(--line);background:var(--card);border-radius:20px;padding:5px 12px;min-height:36px;font-size:13px}
.seg button.on{background:var(--green);border-color:var(--green);color:var(--on)}
.s-hint{font-size:16px;color:var(--muted);margin:0 0 10px}
.modes{display:grid;gap:8px;margin-bottom:12px}
.modes small{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:4px}
input.mini{width:84px!important;min-height:36px!important;padding:4px 8px!important;display:inline-block}
.plan{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:14px 0;border-top:3px solid var(--green)}
.plan p{margin:6px 0}
.plan-big{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px}
.plan-big div{background:var(--paper);border-radius:8px;padding:8px 10px}
.plan-big span,.plan-big small{display:block;font-size:12px;color:var(--muted)}
.plan-big strong{font-size:24px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.2}
.plan-big .neg strong{color:var(--red)}
table.sizes{font-size:12.5px;margin-top:8px}table.sizes th,table.sizes td{text-align:center;padding:4px 6px}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px;margin-bottom:6px}
.ph{margin:0;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center}
.phb{width:96px;height:96px;border-radius:12px;border:1px solid var(--line);background:var(--paper);display:grid;place-items:center;overflow:hidden;padding:0;color:var(--muted)}
.phb img{width:100%;height:100%;object-fit:cover}.phb svg.i{width:34px;height:34px}
.ph figcaption{font-size:12px;color:var(--muted);max-width:104px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.phup{cursor:pointer}
.ph-big{max-width:94vw;max-height:88vh;border-radius:10px}
.item.col{flex-direction:column;align-items:stretch}
.kidrow{padding:4px 0 0 0;margin-inline-start:46px}
.linkish{border:0;background:none;padding:0;text-align:start;color:inherit;font:inherit;font-weight:500}
details summary{cursor:pointer;padding:6px 0}
.addbox{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:4px 12px 10px;margin-bottom:10px}
.addbox summary{font-weight:600;color:var(--green);display:flex;align-items:center;gap:6px}
</style>
</head>
